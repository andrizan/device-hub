[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

# The GPUI core is replaced with the patched copy in vendor/ (spring wheel scrolling).
# See vendor/README.md for the changes.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }

[profile.release]
strip = true
opt-level = 3
lto = "thin"
codegen-units = 1

# The OBS overlay's CPU rendering is slow in debug builds (the app uses it for its preview), so optimize it.
[profile.dev.package.devhub-obs]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
