[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# To add a GPU backdrop-filter (the base of Liquid Glass) to GPUI, the core and
# the Windows renderer are replaced with the copies in vendor/. See vendor/README.md for the changes.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
strip = true
opt-level = 3
lto = "thin"
codegen-units = 1

# The OBS overlay's CPU rendering is slow in debug builds (the app uses it for its preview), so optimize it.
[profile.dev.package.devhub-obs]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
