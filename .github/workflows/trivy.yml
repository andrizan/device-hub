name: Trivy

# Scans Cargo.lock for known vulnerabilities and the tree for leaked secrets.
# CI calls it on every push and pull request; the weekly run catches advisories
# published after the last push.
on:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy (dependencies + secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to a commit, not a tag: the trivy-action tags were hijacked in
      # March 2026 (CVE-2026-33634). v0.36.0 itself pins setup-trivy by commit.
      - name: Gate on fixable HIGH / CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      # Every severity goes to the Security tab; it reuses the binary and DB above.
      - name: Full report for code scanning
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy.sarif
      # Pull requests from forks get a read-only token and cannot upload.
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: trivy.sarif
          category: trivy
