# git-cliff configuration: CHANGELOG.md and the release notes CI publishes.
# https://git-cliff.org/docs/configuration
#
#   git cliff --tag vX.Y.Z -o CHANGELOG.md   # before tagging a release
#   git cliff --unreleased                   # preview what the next release contains

[changelog]
header = """
# Changelog

All notable changes to Device HUB. Generated by [git-cliff](https://git-cliff.org)
from the commit messages ([Conventional Commits](https://www.conventionalcommits.org)).
Releases before v0.4.0 come from the upstream project and do not follow that format.
"""
# Whitespace is controlled with `-%}`, so every release ends with one blank line.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}

{% for commit in entry.commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
# Keeps the file from ending in a blank line. `--strip all` drops it from release notes.
footer = "<!-- generated by git-cliff -->"
trim = false
render_always = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/andrizan/device-hub" },
]

[git]
conventional_commits = true
# Upstream commits are not conventional; they are listed under "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^doc", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
    { message = "^(chore|style)", group = "<!-- 7 -->Maintenance" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = ".*", group = "<!-- 9 -->Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
