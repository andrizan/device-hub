[package]
name = "devhub-obs"
version = "0.1.0"
edition = "2021"
description = "OBS source plugin: live hall-effect key/button depth for Device HUB hardware."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
devhub-core = { path = "../devhub-core" }
devhub-hid = { path = "../devhub-hid" }
devhub-polling = { path = "../devhub-polling" }
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_IO", "Win32_Graphics_Gdi"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
