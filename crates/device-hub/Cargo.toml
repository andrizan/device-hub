[package]
name = "device-hub"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Device HUB — a GPUI frontend for configuring mice and keyboards without a browser"

[dependencies]
devhub-core = { path = "../devhub-core" }
devhub-hid = { path = "../devhub-hid" }
devhub-update = { path = "../devhub-update" }
devhub-obs = { path = "../devhub-obs" }
devhub-polling = { path = "../devhub-polling" }
fontdue = "0.9"
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mimalloc = { version = "0.1", default-features = false }
smallvec = "1"
futures = "0.3"
raw-window-handle = "0.6"
notify-rust = "4.19"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints.clippy]
# GPUI view code is inherently complex (same practice as the reference implementation).
type_complexity = "allow"
too_many_arguments = "allow"
