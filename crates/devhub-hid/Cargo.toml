[package]
name = "devhub-hid"
version = "0.1.0"
edition = "2021"
description = "HID transport layer for Device HUB. Implements devhub_core::backend over real hardware."

[dependencies]
devhub-core = { path = "../devhub-core" }
hidapi = "2"
serde_json = "1"
# Decrypting exports from the official configurator (hub.xsyd.top) (CryptoJS AES / EVP_BytesToKey)
aes = "0.9"
cbc = "0.2"
md-5 = "0.11"
base64 = "0.23"

# Bluetooth Classic (RFCOMM): the settings channel of earbuds/headphones (bt.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_Bluetooth",
    "Win32_Networking_WinSock",
] }
